[package]
name = "cektrans-proxy"
version = "0.4.7"
edition = "2021"
license = "Apache-2.0"
description = "BRT Nusantara → cektrans.banuacoder.com proxy: token + crypto + Socket.IO fan-out"
publish = false

[[bin]]
name = "cektrans-proxy"
path = "src/main.rs"

[dependencies]
# HTTP / async runtime
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "timeout"] }

# REST client (rustls — no openssl)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# Realtime
socketioxide = { version = "0.15", features = ["state"] }
rust_socketio = { version = "0.6", features = ["async"] }

# Crypto for BRT token + bodies
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
cipher = { version = "0.4", features = ["block-padding"] }
base64 = "0.22"

# Cache
moka = { version = "0.12", features = ["future"] }

# Serialization & util
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
url = "2"
anyhow = "1"
thiserror = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
