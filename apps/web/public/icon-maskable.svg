<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="cektrans">
  <!-- Maskable: full-bleed background, important content kept inside the
       inner 80% safe zone so the OS mask doesn't cut anything. -->
  <rect width="512" height="512" fill="#0A0E14"/>
  <g transform="translate(256 256)">
    <circle cx="0" cy="0" r="84" fill="none" stroke="#1D9CD4" stroke-width="18"/>
    <circle cx="0" cy="0" r="22" fill="#1D9CD4"/>
    <g stroke="#F7F7F4" stroke-width="16" stroke-linecap="round">
      <line x1="0" y1="-128" x2="0" y2="-108"/>
      <line x1="0" y1="108" x2="0" y2="128"/>
      <line x1="-128" y1="0" x2="-108" y2="0"/>
      <line x1="108" y1="0" x2="128" y2="0"/>
    </g>
  </g>
</svg>
