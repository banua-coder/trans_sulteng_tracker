# SPA host config baked into the web container.
# The outer host nginx (on the VPS) terminates TLS and routes /api + /socket.io
# to the proxy container; everything else lands here.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long cache for fingerprinted assets.
  location ~* \.(?:js|mjs|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker must always revalidate.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /registerSW.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # SPA fallback.
  location / {
    add_header X-Content-Type-Options nosniff;
    try_files $uri $uri/ /index.html;
  }
}
