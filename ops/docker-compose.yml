# Production-shaped compose. Mirrors Archipelago's Traefik convention:
#  · Traefik runs on the VPS and owns the `traefik-public` external network.
#  · Containers join that network and declare routing via labels.
#  · TLS is terminated by Traefik (Let's Encrypt).
#
# Two services share the same Host (cektrans.banuacoder.com) and split by path:
#   /api/*       → proxy:8080
#   /socket.io/* → proxy:8080
#   everything else → web:80 (static SPA)
#
# Local-only ports are bound to 127.0.0.1 so a dev box can curl them without
# exposing them publicly. Production deploys SHOULD keep these internal-only.

name: cektrans

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/banua-coder/cektrans-web:latest}
    build:
      context: ..
      dockerfile: ops/web.Dockerfile
      args:
        VITE_BUILD_SHA: ${VITE_BUILD_SHA:-local}
    restart: unless-stopped
    networks:
      - traefik-public
    depends_on:
      proxy:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.cektrans-web.rule=Host(`cektrans.banuacoder.com`)"
      - "traefik.http.routers.cektrans-web.entrypoints=websecure"
      - "traefik.http.routers.cektrans-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cektrans-web.priority=1"
      - "traefik.http.services.cektrans-web.loadbalancer.server.port=80"

  proxy:
    image: ${PROXY_IMAGE:-ghcr.io/banua-coder/cektrans-proxy:latest}
    build:
      context: ..
      dockerfile: ops/proxy.Dockerfile
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:8080
      BRT_REST_BASE: ${BRT_REST_BASE}
      BRT_SOCKET_BASE: ${BRT_SOCKET_BASE}
      BRT_KEY: ${BRT_KEY}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-https://cektrans.banuacoder.com}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # REST: /api/* (higher priority than the web catch-all)
      - "traefik.http.routers.cektrans-api.rule=Host(`cektrans.banuacoder.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.cektrans-api.entrypoints=websecure"
      - "traefik.http.routers.cektrans-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cektrans-api.priority=10"
      - "traefik.http.routers.cektrans-api.service=cektrans-proxy"
      # Socket.IO upgrade is handled by Traefik out of the box.
      - "traefik.http.routers.cektrans-ws.rule=Host(`cektrans.banuacoder.com`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.cektrans-ws.entrypoints=websecure"
      - "traefik.http.routers.cektrans-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cektrans-ws.priority=10"
      - "traefik.http.routers.cektrans-ws.service=cektrans-proxy"
      - "traefik.http.services.cektrans-proxy.loadbalancer.server.port=8080"

networks:
  traefik-public:
    name: traefik-public
    external: true
