name: Deploy cektrans

on:
  push:
    tags: ['cektrans/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 0.1.0)'
        required: true

concurrency:
  group: vps-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ${{ github.repository_owner }}/cektrans-web
  PROXY_IMAGE: ${{ github.repository_owner }}/cektrans-proxy

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF#refs/tags/cektrans/v}" >> "$GITHUB_OUTPUT"
          fi

  build-web:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/web.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cektrans-web
          cache-to: type=gha,mode=max,scope=cektrans-web
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
            VITE_GA_ID=${{ vars.VITE_GA_ID }}

  build-proxy:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/proxy.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cektrans-proxy
          cache-to: type=gha,mode=max,scope=cektrans-proxy

  deploy:
    needs: [resolve-version, build-web, build-proxy]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_VERSION: ${{ needs.resolve-version.outputs.version }}
        with:
          # SSH private key lives in the banua-coder org-level secret
          # WORKFLOW_TOKEN, shared with Archipelago + cektrans deploys.
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.WORKFLOW_TOKEN }}
          envs: DEPLOY_VERSION
          script: |
            set -euo pipefail
            cd /opt/cektrans
            export VERSION="$DEPLOY_VERSION"
            ./deploy.sh "$VERSION"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke check production
        env:
          PROXY_BASE: https://cektrans.banuacoder.com
          ORIGIN: https://cektrans.banuacoder.com
        run: bash scripts/smoke.sh
