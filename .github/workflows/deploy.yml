name: Deploy cektrans

on:
  push:
    tags: ['cektrans/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 0.1.0)'
        required: true

concurrency:
  group: vps-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ${{ github.repository_owner }}/cektrans-web
  PROXY_IMAGE: ${{ github.repository_owner }}/cektrans-proxy

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF#refs/tags/cektrans/v}" >> "$GITHUB_OUTPUT"
          fi

  build-web:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The full prod env ships as ONE base64-encoded secret (ENV_B64).
      # We decode it, then promote the VITE_* keys into the runner env so
      # docker build-args can reference them. Backend-only keys (BRT_KEY
      # etc.) are present in the file but never read on this job.
      - name: Decode prod env
        env:
          ENV_B64: ${{ secrets.ENV_B64 }}
        run: |
          if [ -z "$ENV_B64" ]; then
            echo "::error::ENV_B64 secret is missing"; exit 1
          fi
          printf '%s' "$ENV_B64" | base64 --decode > .env.prod
          grep -E '^VITE_[A-Z0-9_]+=' .env.prod >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/web.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cektrans-web
          cache-to: type=gha,mode=max,scope=cektrans-web
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
            VITE_GA_ID=${{ env.VITE_GA_ID }}

  build-proxy:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/proxy.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cektrans-proxy
          cache-to: type=gha,mode=max,scope=cektrans-proxy

  deploy:
    needs: [resolve-version, build-web, build-proxy]
    runs-on: ubuntu-latest
    # `packages: read` lets us pass GITHUB_TOKEN to the VPS so the
    # daemon can pull the freshly-built images without relying on
    # a long-lived PAT cached in ~/.docker/config.json (that's how
    # v0.8.3 broke — the previously cached PAT expired between
    # v0.8.2 and v0.8.3 deploys).
    permissions:
      contents: read
      packages: read
    steps:
      # Mirror the pico-api-go pattern: org-level DEPLOY_* secrets +
      # webfactory/ssh-agent + raw ssh on a custom port.
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the VPS host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - uses: actions/checkout@v4

      # Sync the latest deploy/rollback/cleanup scripts + compose file
      # from the repo to the VPS before invoking deploy.sh. Without
      # this, script edits in PRs never reach prod until somebody
      # manually scp's them. The scripts are small and the rsync is
      # cheap; doing it on every deploy keeps prod and the repo in
      # lockstep.
      - name: Sync ops scripts to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          scp -P "$DEPLOY_PORT" \
            ops/deploy.sh \
            ops/rollback.sh \
            ops/cleanup-images.sh \
            ops/docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x \"$DEPLOY_PATH\"/deploy.sh \"$DEPLOY_PATH\"/rollback.sh \"$DEPLOY_PATH\"/cleanup-images.sh"

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_B64: ${{ secrets.ENV_B64 }}
          DEPLOY_VERSION: ${{ needs.resolve-version.outputs.version }}
          # Per-run token issued by GitHub for this workflow; expires
          # when the job ends. The VPS uses it to docker-login to GHCR
          # so we never depend on a cached long-lived PAT.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            VERSION="$DEPLOY_VERSION" \
            ENV_B64="$ENV_B64" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            GHCR_USER="$GHCR_USER" \
            'bash -s' <<'ENDSSH'
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # Refresh /opt/cektrans/.env from the freshly-decoded secret
            # so any rotated key takes effect on this deploy.
            printf '%s' "$ENV_B64" | base64 -d > .env
            chmod 600 .env
            # Refresh GHCR auth on every deploy. Without this we'd rely
            # on whatever PAT was last cached in ~/.docker/config.json,
            # which silently breaks the day that PAT expires.
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USER" --password-stdin
            ./deploy.sh "$VERSION"
          ENDSSH

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SSH setup happens before the smoke so the rollback step below
      # has an agent + known_hosts entry ready if it fires. Doing it
      # only on failure would leave the smoke step without the SSH
      # context needed to roll back.
      - name: Setup SSH agent (for potential rollback)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the VPS host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Smoke check production
        id: smoke
        env:
          PROXY_BASE: https://cektrans.banuacoder.com
          ORIGIN: https://cektrans.banuacoder.com
        run: bash scripts/smoke.sh

      # The in-deploy health gate already rolls back stacks that never
      # reach `healthy`. This second layer catches the case where the
      # container reports healthy but real traffic regresses — bad
      # config, broken API contract, etc.
      - name: Rollback on smoke failure
        if: failure() && steps.smoke.conclusion == 'failure'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd \"$DEPLOY_PATH\" && bash ./rollback.sh"
